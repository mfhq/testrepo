name: Set up the tools
description: >
  Load the image of the CI container that the tools job built, and let builds
  create user namespaces on the runner.

inputs:
  make-room:
    description: Remove toolchains of the runner that we do not need, to make room for builds
    default: 'false'

runs:
  using: composite
  steps:
    - name: Make room for builds
      if: inputs.make-room == 'true'
      shell: bash
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /

    - name: Download the tools image
      uses: actions/download-artifact@v8
      with:
        name: tools-image
        path: ${{ runner.temp }}/tools-image

    - name: Load the tools image
      shell: bash
      run: |
        zstd -dc "$RUNNER_TEMP/tools-image/tools-image.tar.zst" | sudo podman load
        rm -rf "$RUNNER_TEMP/tools-image"

    # Builds need capabilities in the user namespaces they create. Ubuntu takes
    # those away from unconfined programs, and its AppArmor profile for bwrap
    # attaches inside containers too.
    - name: Allow user namespaces
      shell: bash
      run: |
        if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        if sudo grep -qs '^bwrap ' /sys/kernel/security/apparmor/profiles; then
          sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
        fi
