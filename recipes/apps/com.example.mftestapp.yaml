# A small Qt application for testing Manifold
component: com.example.mftestapp
version: 0.1.0

command: mftestapp

base: net.debian.core13.kf6  # a core or a platform
base-version: 6.8.0

packages:
  apt:
  - vulkan-tools
  - vkd3d-demos
  - clpeak
packages-sdk:
  apt:
  - meson
  - pkgconf
  - appstream

rename:
  lib/udev/rules.d/60-mftestapp.rules: 60-com.example.mftestapp.rules

integration:
  alias:
  - mftestapp
  systemd-unit-system:
  - com.example.mftestapp-report.service
  udev-rule:
  - 60-com.example.mftestapp.rules

parts:
- name: mftestapp
  buildsystem: meson
  sources:
  - type: git
    url: https://github.com/mfhq/mf-test-app.git
    branch: main
